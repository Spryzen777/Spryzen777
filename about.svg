  <rect x="890" y="28" width="8" height="6" fill="#10b981" />
  <rect x="900" y="28" width="8" height="6" fill="#10b981" />
  <rect x="910" y="28" width="8" height="6" fill="#10b981" />

  <!-- Scanning Hologram Beam -->
  <rect x="16" y="0" width="928" height="8" fill="#8b5cf6" opacity="0.3" class="scanline" />

  <!-- ==================== SYNTAX HIGHLIGHTED BIO LINES ==================== -->
  <!-- Line 1: Cyan -->
  <g class="ty" style="animation-delay: 0.1s;">
    <text x="160" y="86" class="t-code" fill="#38bdf8">&gt; BE IN AI &amp; ML AT HKBK COLLEGE OF ENGINEERING</text>
