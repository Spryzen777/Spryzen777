    </g>
  </g>

  <!-- Top Right Battery Indicator -->
  <rect x="886" y="24" width="32" height="14" fill="#1e293b" />
  <rect x="886" y="24" width="32" height="2" fill="#64748b" />
  <rect x="886" y="36" width="32" height="2" fill="#64748b" />
  <rect x="886" y="24" width="2" height="14" fill="#64748b" />
  <rect x="916" y="24" width="2" height="14" fill="#64748b" />
  <rect x="918" y="28" width="4" height="6" fill="#64748b" />
  
