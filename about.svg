<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  
  <defs>
    <style>
      .t-code { font-family: 'Courier New', 'Consolas', monospace; font-weight: bold; font-size: 16px; letter-spacing: 1px; }
      .ty { animation: ty 12s steps(1) infinite backwards; }
      @keyframes ty { 0%{opacity:0} 1%{opacity:1} 90%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      
      .cur { animation: cur 0.8s steps(2, end) infinite; }
      @keyframes cur { 50%{opacity:0} }

      .bob { animation: bob 1.2s steps(2, end) infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }

      .scanline { animation: scan 4s linear infinite; }
      @keyframes scan { 0% { transform: translateY(-20px); } 100% { transform: translateY(220px); } }
    </style>
  </defs>

  <!-- ==================== METALLIC GBA CASING ==================== -->
  <rect x="4" y="0" width="952" height="210" fill="#1e1e24" />
  <rect x="0" y="4" width="960" height="202" fill="#1e1e24" />
  
  <!-- Silver Screen Bezel -->
  <rect x="8" y="4" width="944" height="202" fill="#64748b" />
