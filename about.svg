      <!-- B --><rect x="18" y="0" width="12" height="21" /><rect x="21" y="3" width="6" height="3" fill="#0f172a" /><rect x="21" y="12" width="6" height="6" fill="#0f172a" /><rect x="27" y="0" width="3" height="21" /><rect x="30" y="3" width="3" height="6" /><rect x="30" y="12" width="3" height="6" />
