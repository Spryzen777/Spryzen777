<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" width="100%" height="100%">
  <defs>
    <style>
      .poke-header {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 20px;
        fill: #d9650a;
        letter-spacing: 2px;
      }
      .poke-header-shadow {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 20px;
        fill: #b8b8c8;
        letter-spacing: 2px;
      }
      .poke-body {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 15px;
        fill: #303038;
        letter-spacing: 1.5px;
      }
      .poke-body-shadow {
        font-family: 'Courier New', monospace;
        font-weight: 900;
        font-size: 15px;
        fill: #b8b8c8;
        letter-spacing: 1.5px;
      }
      /* Looping Typewriter for All 4 Lines */
      .type-l1 { clip-path: inset(0 100% 0 0); animation: animL1 12s steps(44, end) infinite; }
      .type-l2 { clip-path: inset(0 100% 0 0); animation: animL2 12s steps(44, end) infinite; }
      .type-l3 { clip-path: inset(0 100% 0 0); animation: animL3 12s steps(44, end) infinite; }
      .type-l4 { clip-path: inset(0 100% 0 0); animation: animL4 12s steps(44, end) infinite; }

      @keyframes animL1 {
        0%, 3% { clip-path: inset(0 100% 0 0); }
        22%, 88% { clip-path: inset(0 0% 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes animL2 {
        0%, 22% { clip-path: inset(0 100% 0 0); }
        42%, 88% { clip-path: inset(0 0% 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes animL3 {
        0%, 42% { clip-path: inset(0 100% 0 0); }
        62%, 88% { clip-path: inset(0 0% 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }
      @keyframes animL4 {
        0%, 62% { clip-path: inset(0 100% 0 0); }
        82%, 88% { clip-path: inset(0 0% 0 0); }
        96%, 100% { clip-path: inset(0 100% 0 0); }
      }

      /* Blinking Red Dialogue Advancement Arrow */
      .gba-arrow { animation: arrowBlink 0.7s steps(2, end) infinite; }
      @keyframes arrowBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Outer Pokémon GBA Corner-Notched Frame -->
  <rect x="4" y="0" width="952" height="176" fill="#383838" />
  <rect x="0" y="4" width="960" height="168" fill="#383838" />

  <rect x="8" y="4" width="944" height="168" fill="#f8f8f8" />
  <rect x="4" y="8" width="952" height="160" fill="#f8f8f8" />

  <rect x="12" y="8" width="936" height="160" fill="#5a6ad0" />
  <rect x="8" y="12" width="944" height="152" fill="#5a6ad0" />

  <rect x="16" y="12" width="928" height="152" fill="#f8f8f8" />
  <rect x="12" y="16" width="936" height="144" fill="#f8f8f8" />

  <!-- ================================================================= -->
  <!-- INTEGRATED HEADER: "ABOUT ME" (ATTACHED IN ONE)                   -->
  <!-- ================================================================= -->
  <g transform="translate(32, 36)">
    <!-- Header Shadow & Orange Text -->
    <text x="3" y="3" class="poke-header-shadow">ABOUT ME</text>
    <text x="0" y="0" class="poke-header">ABOUT ME</text>

    <!-- Header Divider Pixel Line -->
    <rect x="0" y="10" width="896" height="2" fill="#5a6ad0" />
    <rect x="0" y="12" width="896" height="2" fill="#b8b8c8" />
  </g>

  <!-- ================================================================= -->
  <!-- INTEGRATED BODY: 4-LINE ABOUT TEXT (LOOPING GENERATION)          -->
  <!-- ================================================================= -->
  <g transform="translate(32, 74)">
    <!-- Line 1 -->
    <g class="type-l1">
      <text x="2" y="2" class="poke-body-shadow">BE IN AI & ML AT HKBK COLLEGE OF ENGINEERING</text>
      <text x="0" y="0" class="poke-body">BE IN AI & ML AT HKBK COLLEGE OF ENGINEERING</text>
    </g>

    <!-- Line 2 -->
    <g class="type-l2" transform="translate(0, 24)">
      <text x="2" y="2" class="poke-body-shadow">FOCUS: COMPUTER VISION, GENERATIVE AI, LLMS</text>
      <text x="0" y="0" class="poke-body">FOCUS: COMPUTER VISION, GENERATIVE AI, LLMS</text>
    </g>

    <!-- Line 3 -->
    <g class="type-l3" transform="translate(0, 48)">
      <text x="2" y="2" class="poke-body-shadow">BUILDING: MEMORYMATE, MOBILE APP - IN PROGRESS</text>
      <text x="0" y="0" class="poke-body">BUILDING: MEMORYMATE, MOBILE APP - IN PROGRESS</text>
    </g>

    <!-- Line 4 -->
    <g class="type-l4" transform="translate(0, 72)">
      <text x="2" y="2" class="poke-body-shadow">GOAL: AI/ML ENGINEER - CV AND GEN AI PRODUCTS</text>
      <text x="0" y="0" class="poke-body">GOAL: AI/ML ENGINEER - CV AND GEN AI PRODUCTS</text>
    </g>
  </g>

  <!-- Blinking Red GBA Dialogue Advance Arrow -->
  <g transform="translate(914, 142)" class="gba-arrow">
    <polygon points="0,0 16,0 8,10" fill="#e04040" />
  </g>
</svg>
