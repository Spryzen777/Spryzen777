  <rect x="28" y="46" width="104" height="4" fill="#3b82f6" />
  <rect x="28" y="146" width="104" height="4" fill="#3b82f6" />
  <rect x="28" y="46" width="4" height="104" fill="#3b82f6" />
  <rect x="128" y="46" width="4" height="104" fill="#3b82f6" />
  
  <!-- Bobbing Avatar Headshot -->
  <g class="bob">
    <g transform="translate(32, 50)">
      <!-- Hair Spikes -->
      <rect x="24" y="8" width="48" height="16" fill="#0f172a" />
      <rect x="16" y="16" width="64" height="24" fill="#1e1b4b" />
