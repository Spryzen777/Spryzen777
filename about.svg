  <rect x="16" y="72" width="928" height="2" fill="#1e293b" opacity="0.5" />
  <rect x="16" y="92" width="928" height="2" fill="#1e293b" opacity="0.5" />
  <rect x="16" y="112" width="928" height="2" fill="#1e293b" opacity="0.5" />
  <rect x="16" y="132" width="928" height="2" fill="#1e293b" opacity="0.5" />
